Name: im-msgtransfer
Mode: pro
Log:
  ServiceName: im-msgtransfer
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: /var/log/goim/im-msgtransfer
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11040
  Path: /metrics

MsgTransferConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-transfer-topic
  GroupID: msg-transfer-group
  Offset: last
  # MinBytes/MaxBytes/MaxWait 为 Kafka fetch 语义：
  # - MinBytes: broker 攒够 N 字节才返回本批数据；消息量小时要等满 MaxWrite(默认 10s)，
  #   造成消息成批延迟到达。消息链路设为 1 = 来一条立刻交付，延迟毫秒级。
  # - MaxBytes: 单次 fetch 最大字节数，防超大响应。
  # - MaxWait: 无新数据时的兜底等待上限，代码默认 10s（无数据时才触发，不影响实时性）。
  # 高吞吐场景可调大 MinBytes 换取更少 fetch 请求，但消息延迟会上升。
  MinBytes: 1
  MaxBytes: 1048576
  Processors: 4
  Consumers: 1
  # 按消息 key（conversationID）hash 分发到固定 consumeLoop，
  # 同会话消息严格串行处理，保证推送顺序；分片数 = Processors
  KeySharding: true

MsgPersistentTopic:
  Brokers:
    - 127.0.0.1:9092
  # 消息传输主题：msg-transfer-topic
  # 消息持久化主题：msg-persist-topic
  # 消息推送主题：msg-push-topic
  # 消息离线推送主题：msg-offline-push-topic
  Topic: msg-persist-topic
  GroupID: msg-persist-group
  Offset: last
  # 持久化链路同样要求低延迟：落库越早，客户端按 seq 拉取越不容易扑空
  MinBytes: 1
  MaxBytes: 1048576
  Processors: 4
  Consumers: 1

MsgPushProducer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-push-topic
  GroupID: msg-push-group

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: msgtransfer-cache
  Topic: msgtransfer-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
  EnableCache: false
