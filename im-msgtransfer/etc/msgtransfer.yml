Name: im-msgtransfer
Mode: pro
Log:
  ServiceName: im-msgtransfer
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/im-msgtransfer
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11040
  Path: /metrics

MsgTransferConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-transfer-topic
  GroupID: msg-transfer-group
  Offset: last
  MinBytes: 1024
  MaxBytes: 1048576
  Processors: 4
  Consumers: 2

MsgPersistentTopic:
  Brokers:
    - 127.0.0.1:9092
  # 消息传输主题：msg-transfer-topic
  # 消息持久化主题：msg-persist-topic
  # 消息推送主题：msg-push-topic
  # 消息离线推送主题：msg-offline-push-topic
  Topic: msg-persist-topic
  GroupID: msg-persist-group
  Offset: last
  MinBytes: 1024
  MaxBytes: 1048576
  Processors: 4
  Consumers: 2

MsgPushProducer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-push-topic
  GroupID: msg-push-group

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: msgtransfer-cache
  Topic: msgtransfer-topic

Mongo:
  Uri: mongodb://127.0.0.1:27017
  Database: goim

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
