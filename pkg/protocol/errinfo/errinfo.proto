syntax = "proto3";

package openim.errinfo;

option go_package = "github.com/PaperMan11/goim/pkg/protocol/errinfo";

message ErrorInfo {
  string path = 1;
  uint32 line = 2;
  string name = 3;
  string cause = 4;
  repeated string warp = 5;
}

// ErrDetail 携带跨 gRPC 传输的业务错误码与错误信息，
// 由服务端通过 status.WithDetails 附加，客户端解析后还原为 errx.ErrInfo。
message ErrDetail {
  uint32 code = 1;
  string message = 2;
}