Name: im-push
Mode: pro
Log:
  ServiceName: im-push
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: /var/log/goim/im-push
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11050
  Path: /metrics

OfflinePushTopic:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-offline-push-topic
  GroupID: msg-offline-push-group
  Offset: last
  # 离线推送常为批量产生（如群发通知），保留攒批换吞吐，秒级延迟可接受；
  # 语义见 PushConsumer 处注释
  MinBytes: 1024
  MaxBytes: 1048576
  Processors: 4
  Consumers: 2

PushConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-push-topic
  GroupID: msg-push-group
  Offset: last
  # MinBytes: broker 攒够 N 字节才返回本批 fetch 数据。设为 1024 时小消息要等满
  # MaxWait（代码默认 10s）才交付，造成观测到的 5~17s 成批延迟；设为 1 = 来一条
  # 立刻交付，端到端延迟毫秒级。MaxBytes 为单次 fetch 上限，防超大响应。
  MinBytes: 1
  MaxBytes: 1048576
  Processors: 4
  Consumers: 1
  # 按消息 key（conversationID）hash 分发到固定 consumeLoop，
  # 同会话消息严格串行推送，保证到达客户端的顺序与 seq 一致；
  # 不同会话仍并行处理，分片数 = Processors
  KeySharding: true

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: push-cache
  Topic: push-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false
  EnableCache: false

GatewayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msggateway.rpc
  Stub: false
  EnableCache: false

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc
  Stub: false
  EnableCache: false
