Name: im-push
Mode: pro
Log:
  ServiceName: im-push
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/im-push
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11050
  Path: /metrics

OfflinePushTopic:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-offline-push-topic
  GroupID: msg-offline-push-group
  Offset: last
  MinBytes: 1024
  MaxBytes: 1048576
  Processors: 4
  Consumers: 2

PushConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: msg-push-topic
  GroupID: msg-push-group
  Offset: last
  MinBytes: 1024
  MaxBytes: 1048576
  Processors: 4
  Consumers: 2

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: push-cache
  Topic: push-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false

GatewayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msggateway.rpc
  Stub: false

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc
  Stub: false
