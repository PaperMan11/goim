Name: im-api
Host: 0.0.0.0
Port: 18880
Mode: pro
Log:
  ServiceName: im-api
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: /var/log/goim/im-api
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11010
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: api-cache
  Topic: api-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim
  EnableCache: false

AuthRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: auth.rpc
  Stub: false
  EnableCache: false

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false
  EnableCache: false

RelationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: relation.rpc
  Stub: false
  EnableCache: false

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
  EnableCache: false

PushRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: push.rpc
  Stub: false
  EnableCache: false

GatewayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msggateway.rpc
  Stub: false
  EnableCache: false

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc
  Stub: false
  EnableCache: false

ConversationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: conversation.rpc
  Stub: false
  EnableCache: false