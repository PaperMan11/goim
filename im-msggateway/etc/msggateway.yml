Name: im-msggateway
Mode: pro
ListenOn: 0.0.0.0:8070
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: im-msggateway.rpc
Prometheus:
  Host: 0.0.0.0
  Port: 11030
  Path: /metrics
Log:
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: console # [console,file,volume]
  Encoding: plain
  Path: logs/im-msggateway
  Level: debug

WsServer:
  Host: 0.0.0.0
  Port: 50001
  MaxConns: 1024096
  MaxMsgSize: 1024096
  WriteWait: 10 # 写入超时时间
  PongWait: 60 # 读取超时时间
  PingPeriod: 5 # 心跳周期
  EnableAuth: true # 是否开启认证，默认开启

  # 多端登录策略配置
  LoginStrategy:
    LoginStrategy: allow_multi # 登录策略: allow_multi(允许多端), single(单端), replace(踢掉旧连接), replace_same_platform(同平台替换)
    MaxConnPerUser: 10 # 每个用户最大连接数(allow_multi策略下生效)
    MaxConnPerUserPerPlatform: 3 # 每个用户每个平台最大连接数

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: msggateway-cache
  Topic: msggateway-topic

Redis:
  Host: 127.0.0.1:6379
  Pass: 123456

Mongo:
  Uri: mongodb://127.0.0.1:27017
  Database: goim

# RPC 配置
AuthRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: auth.rpc
  Stub: false

UserRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: user.rpc
  Stub: false

MsgRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: msg.rpc
  Stub: false

PushRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: push.rpc
  Stub: false