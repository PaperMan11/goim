Name: conversation.rpc
ListenOn: 0.0.0.0:18020
Mode: pro
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: conversation.rpc

Log:
  ServiceName: conversation.rpc
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/conversation-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 28020
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"
  Key: conversation.redis

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: conversation-cache
  Topic: conversation-cache-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc
  Stub: false

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
