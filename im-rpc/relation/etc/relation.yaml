Name: relation.rpc
ListenOn: 0.0.0.0:18050
Mode: pro
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: relation.rpc

Log:
  ServiceName: relation.rpc
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/relation-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 28050
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"
  Key: relation.redis

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: relation-cache
  Topic: relation-cache-topic

Mongo:
  Uri: mongodb://root:123456@127.0.0.1:27017/?authSource=admin
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: user.rpc
  Stub: false
  
MsgRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: msg.rpc
  Stub: false
  