Name: relation.rpc
Host: 0.0.0.0
ListenOn: 0.0.0.0:18050
Mode: pro
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: relation.rpc

Log:
  ServiceName: relation.rpc
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/relation-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 28050
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: 123456

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: relation-cache
  Topic: relation-cache-topic

Mongo:
  Uri: mongodb://localhost:27017
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: user.rpc
  Stub: false
  
