Name: group.rpc
ListenOn: 0.0.0.0:18030
Mode: pro
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: group.rpc

Log:
  ServiceName: group.rpc
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/group-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 28030
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: 123456

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: group-cache
  Topic: group-cache-topic

Mongo:
  Uri: mongodb://127.0.0.1:27017
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
