Name: user.rpc
ListenOn: 0.0.0.0:18060
Mode: pro
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: user.rpc

Log:
  ServiceName: user.rpc
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Encoding: plain
  Path: logs/user-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 28060
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Pass: "123456"
  Key: user.redis

LocalCacheConf:
  Expire: 5m
  Limit: 1000
  Name: user-cache
  Topic: user-cache-topic

Mongo:
  Uri: mongodb://127.0.0.1:27017
  Database: goim

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  Stub: false

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false
