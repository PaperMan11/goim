Name: im-cron
Mode: pro
Log:
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: console # [console,file,volume]
  Encoding: plain
  Path: logs/im-cron
  Level: debug
Prometheus:
  Host: 0.0.0.0
  Port: 11020
  Path: /metrics

CronTask:
  MsgRetentionDays: 7
  ConvRetentionDays: 7

Redis:
  Host: 127.0.0.1:6379
  Pass: 123456

# RPC 配置
ConvRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: conversation.rpc
  Stub: false

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc
  Stub: false