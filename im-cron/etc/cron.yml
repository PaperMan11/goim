Name: im-cron
Log:
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: console # [console,file,volume]
  Encoding: plain
  Path: logs/im-cron
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 9001
  Path: /metrics

CronTask:
  MsgRetentionDays: 7
  ConvRetentionDays: 7

Redis:
  Host: 127.0.0.1:6379
  Type: node

# RPC 配置
ConvRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: conversation.rpc
  Stub: true

MsgRpc:
  Etcd:
    Hosts:
      - 192.168.241.128:2379
    Key: msg.rpc
  Stub: true